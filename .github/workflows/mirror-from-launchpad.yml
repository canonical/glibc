name: Mirror from Launchpad

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch from Launchpad
        run: |
          git remote add launchpad https://git.launchpad.net/ubuntu/+source/glibc
          git fetch launchpad '+refs/heads/*:refs/remotes/launchpad/*' '+refs/tags/*:refs/tags/*'

      - name: Push branches and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/launchpad/); do
            git push --force origin "refs/remotes/launchpad/${branch}:refs/heads/${branch}"
          done
          git push --force --tags origin
